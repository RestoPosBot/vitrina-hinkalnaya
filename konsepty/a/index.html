<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFB03A">
<title>Хинкальная — концепт A «Жар и мёд»</title>
<link rel="stylesheet" href="../../shrifty/shrifty.css">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- Значки семейств разделов: плитка блюда без фото показывает такой значок на градиенте -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- хинкали: мешочек с хвостиком и складками -->
    <symbol id="ik-hinkali" viewBox="0 0 64 64">
      <path d="M27 27 C 25 19, 27 11, 31 5 C 32.5 2.5, 37.5 2.5, 38 6 C 38.5 13, 37.5 20, 37 27 Z" fill="currentColor"/>
      <path d="M26 26 C 14 28, 4 38, 4 47 C 4 57, 17 62, 32 62 C 47 62, 60 57, 60 47 C 60 38, 50 28, 38 26 Z" fill="currentColor"/>
      <g fill="none" stroke="rgba(120,60,20,.22)" stroke-width="1.6" stroke-linecap="round">
        <path d="M29 28 C 22 33, 13 41, 10 54"/>
        <path d="M31.5 28 C 30 36, 28 46, 27 59"/>
        <path d="M34 28 C 40 34, 48 42, 52 54"/>
        <path d="M36 27 C 44 30, 52 35, 57 44"/>
        <path d="M28 27 C 20 30, 12 35, 7 44"/>
        <path d="M31 25 C 30 18, 31 11, 34 6"/>
      </g>
    </symbol>
    <!-- хачапури-лодочка -->
    <symbol id="ik-hachapuri" viewBox="0 0 64 64">
      <path d="M3 32 C 13 12, 51 12, 61 32 C 51 52, 13 52, 3 32 Z" fill="currentColor"/>
      <ellipse cx="32" cy="32" rx="19" ry="9.5" fill="rgba(120,60,20,.18)"/>
      <circle cx="32" cy="32" r="6.5" fill="currentColor"/>
      <circle cx="30.5" cy="30.5" r="2" fill="rgba(255,255,255,.7)"/>
    </symbol>
    <!-- шампур с тремя кусками -->
    <symbol id="ik-shampur" viewBox="0 0 64 64">
      <g transform="rotate(-40 32 32)">
        <path d="M32 2 L35 8 L29 8 Z" fill="currentColor"/>
        <rect x="30.5" y="7" width="3" height="55" rx="1.5" fill="currentColor"/>
        <rect x="21" y="13" width="22" height="11" rx="5.5" fill="currentColor"/>
        <rect x="21" y="27" width="22" height="11" rx="5.5" fill="currentColor"/>
        <rect x="21" y="41" width="22" height="11" rx="5.5" fill="currentColor"/>
        <circle cx="33" cy="60" r="3" fill="currentColor"/>
      </g>
    </symbol>
    <!-- пламя -->
    <symbol id="ik-plamya" viewBox="0 0 64 64">
      <path d="M33 3 C 40 14, 54 22, 54 40 C 54 52, 44 61, 32 61 C 20 61, 10 52, 10 40 C 10 31, 16 27, 19 19 C 22 26, 27 28, 29 24 C 27 17, 28 10, 33 3 Z" fill="currentColor"/>
      <path d="M32 33 C 37 39, 42 42, 42 48 C 42 54, 37 58, 32 58 C 27 58, 22 54, 22 48 C 22 43, 26 41, 28 36 C 29 39, 31 39, 32 33 Z" fill="rgba(255,255,255,.55)"/>
    </symbol>
    <!-- лист -->
    <symbol id="ik-list" viewBox="0 0 64 64">
      <path d="M7 57 C 7 26, 28 6, 58 6 C 58 38, 38 57, 7 57 Z" fill="currentColor"/>
      <path d="M9 55 C 22 42, 36 30, 52 14" fill="none" stroke="rgba(30,80,40,.3)" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <!-- ягода -->
    <symbol id="ik-yagoda" viewBox="0 0 64 64">
      <circle cx="32" cy="38" r="21" fill="currentColor"/>
      <path d="M32 18 C 30 10, 36 5, 44 6 C 42 13, 38 17, 32 18 Z" fill="rgba(60,120,60,.6)"/>
      <ellipse cx="24" cy="30" rx="5" ry="3" fill="rgba(255,255,255,.55)" transform="rotate(-25 24 30)"/>
    </symbol>
    <!-- бокал -->
    <symbol id="ik-bokal" viewBox="0 0 64 64">
      <path d="M16 5 H48 C 48 25, 41 34, 35 36 V52 H44 V58 H20 V52 H29 V36 C 23 34, 16 25, 16 5 Z" fill="currentColor"/>
      <path d="M19 12 H45 C 44 22, 39 28, 32 28 C 25 28, 20 22, 19 12 Z" fill="rgba(120,20,60,.45)"/>
    </symbol>
    <!-- набор -->
    <symbol id="ik-nabor" viewBox="0 0 64 64">
      <circle cx="21" cy="24" r="12" fill="currentColor"/>
      <circle cx="43" cy="24" r="12" fill="currentColor" opacity=".85"/>
      <circle cx="32" cy="43" r="12" fill="currentColor" opacity=".7"/>
    </symbol>
  </defs>
</svg>

<!-- Живой фон: свет из печи. Канвас маленький, растянут и размыт CSS-ом -->
<canvas id="fon" class="fon" aria-hidden="true"></canvas>

<div class="stolb" id="stolb">

  <!-- Шапка: заведение, статус, поиск -->
  <header class="shapka">
    <div class="shapka__verh">
      <button class="mesto" id="mesto" type="button" aria-label="Сменить заведение">
        <span class="mesto__set">Хинкальная</span>
        <span class="mesto__nazvanie"><span id="mesto-nazvanie">…</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </span>
        <span class="mesto__status" id="mesto-status"><i class="tochka"></i><span>…</span></span>
      </button>
      <button class="chip" id="sposob" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Самовывоз
      </button>
    </div>
    <label class="poisk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="poisk" placeholder="Хинкали, хачапури, шашлык…" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <!-- Сторис: кольца горят -->
  <section class="istorii" id="istorii" aria-label="Акции"></section>

  <!-- Липкая лента разделов -->
  <nav class="lenta" id="lenta" aria-label="Разделы меню"></nav>

  <!-- Разделы с карточками -->
  <main id="razdely" class="razdely"></main>

  <footer class="podval">
    <p>Пруф главного экрана · концепт A «Жар и мёд» · данные — настоящее меню</p>
  </footer>
</div>

<!-- Нижняя навигация с корзиной -->
<nav class="niz" aria-label="Навигация">
  <button class="niz__punkt aktiven" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>
    <span>Меню</span>
  </button>
  <button class="niz__punkt" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>Поиск</span>
  </button>
  <button class="niz__punkt" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
    <span>Заказы</span>
  </button>
  <button class="niz__korzina" id="korzina-knopka" type="button" aria-label="Корзина">
    <span class="niz__korzina-ikonka">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.5"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <b class="niz__schet" id="korzina-schet" hidden>0</b>
    </span>
    <span class="niz__tekst"><span id="korzina-tekst">Корзина</span><span class="niz__summa" id="korzina-summa"></span></span>
  </button>
</nav>

<!-- Хинкалик: мешочек с вытянутым хвостиком и глазами. 80 px, справа снизу над навигацией -->
<div class="hinkalik" id="hinkalik" role="button" tabindex="0" aria-label="Хинкалик, помощник">
  <div class="hinkalik__oblachko" id="hinkalik-oblachko" hidden></div>
  <svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true">
    <defs>
      <linearGradient id="testo-gr" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#FFF4DC"/>
        <stop offset="0.55" stop-color="#F5DCAB"/>
        <stop offset="1" stop-color="#DDB77A"/>
      </linearGradient>
      <linearGradient id="hvost-gr" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#E8C48A"/>
        <stop offset="0.5" stop-color="#FFF1D3"/>
        <stop offset="1" stop-color="#D9B071"/>
      </linearGradient>
      <radialGradient id="blik-gr" cx="0.35" cy="0.3" r="0.5">
        <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="hinkalik-telo">
      <!-- хвостик: высокий, скрученный, с витками -->
      <path d="M40 47 C 37 37, 39 24, 45 12 C 47 6, 59 6, 61 12 C 63 24, 62 37, 60 47 Z" fill="url(#hvost-gr)" stroke="#B48A55" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="none" stroke="#C99F62" stroke-width="1.4" stroke-linecap="round" opacity=".9">
        <path d="M47 45 C 45 35, 46 25, 50 13"/>
        <path d="M54 45 C 55 35, 55 25, 56 13"/>
        <path d="M43 30 C 48 28, 54 28, 59 30"/>
        <path d="M42 22 C 47 20, 53 20, 59 22"/>
      </g>
      <!-- мешочек: широкое дно, узкая шейка -->
      <path d="M38 47 C 22 49, 8 60, 8 72 C 8 87, 27 96, 50 96 C 73 96, 92 87, 92 72 C 92 60, 78 49, 62 47 Z" fill="url(#testo-gr)" stroke="#B48A55" stroke-width="2" stroke-linejoin="round"/>
      <!-- сборки у шейки: бугорки -->
      <path d="M36 49 q3.5 -5 7 0 q3.5 -5 7 0 q3.5 -5 7 0 q3.5 -5 7 0" fill="none" stroke="#B48A55" stroke-width="1.5" stroke-linecap="round"/>
      <!-- складки от шейки к бокам -->
      <g fill="none" stroke="#C99F62" stroke-width="1.7" stroke-linecap="round" opacity=".8">
        <path d="M40 50 C 30 55, 20 63, 15 75"/>
        <path d="M45 50 C 41 55, 37 60, 34 64"/>
        <path d="M50 50 C 50 53, 50 56, 50 59"/>
        <path d="M55 50 C 59 55, 63 60, 66 64"/>
        <path d="M60 50 C 70 55, 80 63, 85 75"/>
      </g>
      <!-- тень у дна -->
      <path d="M14 78 C 22 90, 38 96, 50 96 C 62 96, 78 90, 86 78 C 78 88, 64 93, 50 93 C 36 93, 22 88, 14 78 Z" fill="#B48A55" opacity=".18"/>
      <ellipse cx="30" cy="59" rx="9" ry="5" fill="url(#blik-gr)"/>
      <!-- щёчки -->
      <circle cx="26" cy="80" r="4.5" fill="#F0532D" opacity=".28"/>
      <circle cx="74" cy="80" r="4.5" fill="#F0532D" opacity=".28"/>
      <!-- брови -->
      <g id="hinkalik-brovi" fill="none" stroke="#6B4A2A" stroke-width="2.2" stroke-linecap="round">
        <path d="M31 64 C 34 61, 39 61, 42 63"/>
        <path d="M58 63 C 61 61, 66 61, 69 64"/>
      </g>
      <!-- глаза -->
      <g class="hinkalik__glaz" style="transform-origin:38px 73px">
        <ellipse cx="38" cy="73" rx="6.5" ry="7.5" fill="#fff" stroke="#6B4A2A" stroke-width="1.4"/>
        <circle class="hinkalik__zrachok" cx="38" cy="74" r="3.3" fill="#231A14"/>
        <circle cx="40" cy="71.5" r="1.1" fill="#fff"/>
      </g>
      <g class="hinkalik__glaz" style="transform-origin:62px 73px">
        <ellipse cx="62" cy="73" rx="6.5" ry="7.5" fill="#fff" stroke="#6B4A2A" stroke-width="1.4"/>
        <circle class="hinkalik__zrachok" cx="62" cy="74" r="3.3" fill="#231A14"/>
        <circle cx="64" cy="71.5" r="1.1" fill="#fff"/>
      </g>
      <!-- рот -->
      <path id="hinkalik-rot" d="M44 85 C 47 89, 53 89, 56 85" fill="none" stroke="#6B4A2A" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<div class="tost" id="tost" hidden></div>

<script type="module" src="skript.js"></script>
</body>
</html>
