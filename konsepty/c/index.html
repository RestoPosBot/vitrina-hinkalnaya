<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8213F">
<title>Хинкальная — меню-афиша (концепт «Плакат»)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shrifty/shrifty.css">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- Живой фон: маленький canvas, растянутый и размытый CSS-ом -->
<canvas class="fon" id="fon" width="66" height="142" aria-hidden="true"></canvas>

<!-- SVG-символы: Хинкалик (тело) для плавающего персонажа и баннеров сторис -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hinkalik-testo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3DF"/>
      <stop offset="1" stop-color="#E9C88F"/>
    </linearGradient>
    <!-- Тело: мешочек с вытянутым хвостиком, складки, румянец -->
    <g id="hinkalik-telo">
      <ellipse cx="50" cy="93" rx="26" ry="4" fill="rgba(120,60,20,.18)"/>
      <path d="M50 40 C49 30 52 22 59 13" fill="none" stroke="#E9C88F" stroke-width="11" stroke-linecap="round"/>
      <path d="M50 40 C49 30 52 22 59 13" fill="none" stroke="#8A6A3F" stroke-width="1.6" stroke-linecap="round"
            stroke-dasharray="4 5" opacity=".55"/>
      <path d="M50 38 C28 41 15 60 21 76 C27 94 73 94 79 76 C85 60 72 41 50 38 Z" fill="url(#hinkalik-testo)" stroke="#8A6A3F" stroke-width="1.8"/>
      <g fill="none" stroke="#8A6A3F" stroke-width="1.4" stroke-linecap="round" opacity=".7">
        <path d="M50 42 C43 47 38 52 35 57"/>
        <path d="M50 42 C47 48 45 53 44 58"/>
        <path d="M50 42 C53 48 55 53 56 58"/>
        <path d="M50 42 C57 47 62 52 65 57"/>
      </g>
      <ellipse cx="50" cy="41" rx="7.5" ry="4.2" fill="#E4C48E" stroke="#8A6A3F" stroke-width="1.6"/>
      <circle cx="33" cy="74" r="4.2" fill="#F0532D" opacity=".28"/>
      <circle cx="67" cy="74" r="4.2" fill="#F0532D" opacity=".28"/>
    </g>
  </defs>
</svg>

<div class="telefon" id="telefon">

  <!-- Шапка-афиша -->
  <header class="shapka" id="shapka">
    <div class="shapka__verh">
      <div class="shapka__brend" id="brend">
        <div class="brend__nadpis">Хинкальная</div>
        <div class="brend__pod">меню&#8209;афиша · <span id="brend-data">сентябрь</span></div>
      </div>
      <!-- Круглый штамп с текстом по кругу: «открыто · до 22:00» -->
      <div class="shtamp" id="shtamp" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="shtamp__krug">
          <defs><path id="shtamp-put" d="M50,50 m-36,0 a36,36 0 1,1 72,0 a36,36 0 1,1 -72,0"/></defs>
          <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <text class="shtamp__tekst"><textPath href="#shtamp-put" id="shtamp-textpath">открыто · до 22:00 · открыто · до 22:00 · </textPath></text>
        </svg>
        <div class="shtamp__centr">🥟</div>
      </div>
    </div>

    <button class="mesto" id="mesto" type="button">
      <span class="mesto__ikonka" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>
      </span>
      <span class="mesto__tekst" id="mesto-tekst">Савёловская · открыто до 22:00</span>
      <span class="mesto__strelka" aria-hidden="true">›</span>
    </button>

    <label class="poisk">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.4 12.5l4.6 4.6 1.4-1.4-4.6-4.6A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="currentColor"/></svg>
      <input type="search" placeholder="Хинкали, хачапури, шашлык…" aria-label="Поиск по меню" autocomplete="off">
    </label>
  </header>

  <!-- Сторис: широкие баннеры с персонажем -->
  <section class="istorii" aria-label="Акции">
    <div class="istorii__lenta" id="istorii"></div>
  </section>

  <!-- Бегущая строка афиши: настоящие цифры меню -->
  <div class="begushchaya" aria-hidden="true" id="begushchaya"></div>

  <!-- Липкая лента разделов -->
  <nav class="lenta" id="lenta" aria-label="Разделы меню">
    <div class="lenta__prokrutka" id="lenta-prokrutka"></div>
  </nav>

  <!-- Разделы с обложками и полосами блюд -->
  <main class="razdely" id="razdely">
    <div class="zagruzka" id="zagruzka">Достаём меню из печи…</div>
  </main>

  <div class="podval-otstup"></div>
</div>

<!-- Хинкалик: плавающий персонаж справа снизу -->
<div class="hinkalik" id="hinkalik" title="Хинкалик">
  <svg viewBox="0 0 100 100" class="hinkalik__svg" id="hinkalik-svg">
    <use href="#hinkalik-telo"/>
    <!-- брови -->
    <g class="hinkalik__brovi" fill="none" stroke="#5C4128" stroke-width="2.4" stroke-linecap="round">
      <path d="M33 53 C36 50 41 50 45 52"/>
      <path d="M55 52 C59 50 64 50 67 53"/>
    </g>
    <!-- глаза -->
    <g class="hinkalik__glaza">
      <g class="glaz">
        <ellipse cx="40" cy="64" rx="7" ry="8" fill="#fff" stroke="#5C4128" stroke-width="1.6"/>
        <circle class="zrachok" cx="40" cy="65" r="3.6" fill="#231A14"/>
        <circle cx="42" cy="62.5" r="1.3" fill="#fff"/>
        <ellipse class="veko" cx="40" cy="64" rx="7.6" ry="8.6" fill="#EFD6A6"/>
      </g>
      <g class="glaz">
        <ellipse cx="60" cy="64" rx="7" ry="8" fill="#fff" stroke="#5C4128" stroke-width="1.6"/>
        <circle class="zrachok" cx="60" cy="65" r="3.6" fill="#231A14"/>
        <circle cx="62" cy="62.5" r="1.3" fill="#fff"/>
        <ellipse class="veko" cx="60" cy="64" rx="7.6" ry="8.6" fill="#EFD6A6"/>
      </g>
    </g>
    <!-- рот -->
    <path class="hinkalik__rot" d="M44 78 C47 82 53 82 56 78" fill="none" stroke="#5C4128" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <div class="hinkalik__oblachko" id="hinkalik-oblachko">Привет! Начнём с хинкали?</div>
</div>

<!-- Нижняя навигация с плавающей корзиной -->
<nav class="niz" id="niz" aria-label="Навигация">
  <button class="niz__punkt niz__punkt--aktiv" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z" fill="currentColor"/></svg>
    <span>Меню</span>
  </button>
  <button class="niz__punkt" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.4 12.5l4.6 4.6 1.4-1.4-4.6-4.6A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="currentColor"/></svg>
    <span>Поиск</span>
  </button>
  <button class="korzina korzina--pusto" id="korzina" type="button" aria-label="Корзина">
    <span class="korzina__schet"><span id="korzina-schet">0</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l1.5 4H21l-2 11H5L3 8h3.5L7 4zm1.4 2-.75 2h8.7l-.75-2H8.4zM5.4 10l1.3 7h10.6l1.3-7H5.4z" fill="currentColor"/></svg></span>
    <span class="korzina__nadpis">Корзина</span>
    <span class="korzina__summa" id="korzina-summa">0 ₽</span>
  </button>
</nav>

<script type="module" src="plakat.js"></script>
</body>
</html>
