<script>
/* Покой: через 9 с без касаний вешаем html.pokoy — stil.css ставит декоративные циклы на паузу.
   Любое касание, прокрутка, колесо или клавиша снимают класс. */
(function () {
  var d = document.documentElement, t = 0;
  function usnut() { d.classList.add('pokoy'); }
  function razbudit() {
    if (d.classList.contains('pokoy')) d.classList.remove('pokoy');
    clearTimeout(t);
    t = setTimeout(usnut, 9000);
  }
  ['pointerdown', 'touchstart', 'keydown', 'wheel', 'scroll'].forEach(function (s) {
    addEventListener(s, razbudit, { passive: true, capture: true });
  });
  razbudit();
})();
</script>
